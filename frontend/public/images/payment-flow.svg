<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="750" viewBox="0 0 1180 750" role="img" aria-labelledby="title desc">
<title id="title">Cardano x402 payment sequence</title><desc id="desc">Browser requests a resource, receives HTTP 402, obtains a wallet signature, sends PAYMENT-SIGNATURE, and receives an answer after the facilitator verifies and settles on Cardano.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#476c5d"/></marker><marker id="lightarrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#19754f"/></marker></defs>
<rect width="1180" height="750" rx="20" fill="#f1f7f3"/>
<text x="38" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#193e30">From HTTP request to confirmed Cardano payment</text>
<text x="38" y="70" font-family="system-ui,sans-serif" font-size="13" fill="#53685e">x402 v2 · preprod · 2 tADA + network fee · direct address transfer</text>
<rect x="29" y="95" width="182" height="68" rx="10" fill="#e4efe9" stroke="#adc5b7"/>
<text x="120" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#193e30">Browser</text>
<text x="120" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#53685e">React frontend</text>
<line x1="120" y1="166" x2="120" y2="686" stroke="#b3c6ba" stroke-dasharray="5 7"/>
<rect x="259" y="95" width="182" height="68" rx="10" fill="#e4efe9" stroke="#adc5b7"/>
<text x="350" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#193e30">Wallet</text>
<text x="350" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#53685e">CIP-30 signature</text>
<line x1="350" y1="166" x2="350" y2="686" stroke="#b3c6ba" stroke-dasharray="5 7"/>
<rect x="494" y="95" width="182" height="68" rx="10" fill="#e4efe9" stroke="#adc5b7"/>
<text x="585" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#193e30">Resource server</text>
<text x="585" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#53685e">Spring Boot or Node.js</text>
<line x1="585" y1="166" x2="585" y2="686" stroke="#b3c6ba" stroke-dasharray="5 7"/>
<rect x="729" y="95" width="182" height="68" rx="10" fill="#e4efe9" stroke="#adc5b7"/>
<text x="820" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#193e30">Facilitator</text>
<text x="820" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#53685e">Cardano Foundation</text>
<line x1="820" y1="166" x2="820" y2="686" stroke="#b3c6ba" stroke-dasharray="5 7"/>
<rect x="969" y="95" width="182" height="68" rx="10" fill="#e4efe9" stroke="#adc5b7"/>
<text x="1060" y="123" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="600" fill="#193e30">Cardano</text>
<text x="1060" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#53685e">Blockfrost preprod</text>
<line x1="1060" y1="166" x2="1060" y2="686" stroke="#b3c6ba" stroke-dasharray="5 7"/>
<line x1="120" y1="207" x2="585" y2="207" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="352.5" y="197" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">1  GET answer without payment</text>
<line x1="585" y1="255" x2="120" y2="255" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="352.5" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">2  402 + PAYMENT-REQUIRED (Base64 JSON)</text>
<line x1="120" y1="315" x2="350" y2="315" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="235.0" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">3  Build and sign</text>
<line x1="350" y1="365" x2="120" y2="365" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="235.0" y="355" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">Signed transaction</text>
<line x1="120" y1="417" x2="585" y2="417" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="352.5" y="407" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">4  GET + PAYMENT-SIGNATURE (Base64 JSON)</text>
<line x1="585" y1="461" x2="820" y2="461" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="702.5" y="451" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">5  POST /verify</text>
<line x1="820" y1="502" x2="585" y2="502" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="702.5" y="492" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">isValid: true</text>
<line x1="585" y1="548" x2="820" y2="548" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="702.5" y="538" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">6  POST /settle</text>
<line x1="820" y1="588" x2="1060" y2="588" stroke="#476c5d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="940.0" y="578" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#476c5d">Submit + observe</text>
<line x1="1060" y1="630" x2="820" y2="630" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="940.0" y="620" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">Inclusion + 1 newer block</text>
<line x1="820" y1="667" x2="585" y2="667" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="702.5" y="657" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">success + tx ID</text>
<line x1="585" y1="707" x2="120" y2="707" stroke="#19754f" stroke-width="2" marker-end="url(#lightarrow)"/>
<text x="352.5" y="697" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#19754f">7  200 + JSON answer + PAYMENT-RESPONSE (Base64 JSON)</text>
</svg>
